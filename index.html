<style>
  :root { color-scheme: dark; --bg: #0B0B10; --fg: #E8E6F0; --muted: #8C8AA0; --accent: #D97757; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #game { display: block; width: 100%; height: 100%; cursor: none; touch-action: none; image-rendering: pixelated; }
  #game:focus { outline: none; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 16px; color: var(--fg); }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; place-items: center; padding-inline: 16px; background: var(--bg); color: var(--fg); text-align: center; touch-action: none; pointer-events: auto; }
  #rotate .card { display: grid; justify-items: center; gap: 12px; max-width: 320px; }
  #rotate svg { width: 96px; height: 96px; color: var(--accent); }
  #rotate .big { margin: 0; font-size: 18px; font-weight: bold; }
  #rotate .small { margin: 0; font-size: 12px; color: var(--muted); }
  #install-help { display: none; position: fixed; inset: 0; z-index: 9; place-items: center; padding: 16px; background: rgba(11, 11, 16, 0.8); color: var(--fg); text-align: center; touch-action: none; pointer-events: auto; cursor: pointer; }
  #install-help.open { display: grid; }
  #install-help .card { display: grid; justify-items: center; gap: 12px; max-width: 320px; padding: 20px 24px; background: var(--bg); border: 2px solid var(--accent); }
  #install-help svg { width: 40px; height: 40px; color: var(--accent); }
  #install-help .big { margin: 0; font-size: 16px; font-weight: bold; }
  #install-help .small { margin: 0; font-size: 12px; color: var(--muted); }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
